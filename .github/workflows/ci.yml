name: CI Pipeline

on:
  push:
    branches: [main, master]
    tags: ["v*"]
    paths-ignore:
      - "**.md"
      - ".gitignore"
      - "LICENSE"
      - ".vscode/**"
  pull_request:
    branches: [main, master]
    paths-ignore:
      - "**.md"
      - ".gitignore"
      - "LICENSE"
      - ".vscode/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run meta-tests
        run: make -f dev.mk meta-test

  release:
    name: Create Release
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create GitHub Release
        run: |
          gh release view ${{ github.ref_name }} 2>/dev/null || \
          gh release create ${{ github.ref_name }} \
            --verify-tag \
            --generate-notes \
            --title "${{ github.ref_name }}"
        env:
          GH_TOKEN: ${{ github.token }}

  package:
    name: Build Package (${{ matrix.sdk_version }})
    needs: [test, release]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix:
        sdk_version: ["24.10.6", "25.12.3"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Export Project Variables
        run: |
          grep '^PKG_NAME:=' Makefile | sed 's/:=/=/' >> $GITHUB_ENV
          echo "GIT_COMMIT=${GITHUB_SHA::8}" >> $GITHUB_ENV

      - name: Build Package
        run: make -f dev.mk package SDK_VERSION=${{ matrix.sdk_version }}
        env:
          GIT_COMMIT: ${{ env.GIT_COMMIT }}

      - name: Upload to Release
        run: |
          gh release upload ${{ github.ref_name }} \
            $(find bin/packages -name "${{ env.PKG_NAME }}*") \
            --clobber
        env:
          GH_TOKEN: ${{ github.token }}
