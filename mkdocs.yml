      - Contributing:
          - Add a built-in proxy: how-to/contributor/add-proxy.md
          - Add an assertion: how-to/contributor/add-assertion.md
          - Add a reporter: how-to/contributor/add-reporter.md
          - Run the regression suite: how-to/contributor/run-regression.md
  - Reference:
      - Overview: reference/index.md
      - CLI and Configuration: reference/cli.md
      - DSL: reference/dsl.md
      - Assertions: reference/assertions.md
      - Property-based testing: reference/property.md
      - Mock API: reference/mock-api.md
      - Proxy Data Models: reference/proxy-data-models.md
      - Glossary: reference/glossary.md
      - Internals:
          - Source layout: reference/contributor/source-layout.md
          - Message protocol: reference/contributor/message-protocol.md
          - Proxy context API: reference/contributor/proxy-ctx-api.md
          - Reporter API: reference/contributor/reporter-api.md
  - Explanation:
      - Overview: explanation/index.md
      - Key concepts: explanation/concepts.md
      - About test isolation: explanation/test-isolation.md
      - About inject() vs global.patch(): explanation/inject-vs-patch.md
      - About strict mode: explanation/strict-mode.md
      - About property-based testing: explanation/property-based-testing.md
      - About the worker/coordinator: explanation/worker-coordinator.md
      - About the mock engine: explanation/mock-engine.md
      - About shim generation: explanation/shim-generation.md
