  - Tutorials:
      - Overview: tutorials/index.md
      - Writing your first test: tutorials/user/first-test.md
      - Writing your first mock: tutorials/user/first-mock.md
      - Writing flexible assertions: tutorials/user/first-combinators.md
      - Writing your first property test: tutorials/user/first-property-test.md
      - Contributing your first patch: tutorials/contributor/first-patch.md
  - How-to Guides:
      - Overview: how-to/index.md
      - Testing:
          - Install utest: how-to/install.md
          - Skip tests temporarily: how-to/skip-tests.md
          - Filter tests by name: how-to/filter-tests.md
          - Run tests in CI: how-to/ci.md
          - Troubleshoot common problems: how-to/troubleshoot.md
          - Reproduce a failing property: how-to/property-reproduce.md
      - Mocking:
          - Mock a module with inject(): how-to/mock-inject.md
          - Mock multiple modules at once: how-to/mock-inject-all.md
          - Patch global state: how-to/mock-global-patch.md
          - Save and restore mock state: how-to/snapshot-restore.md
          - Mock the filesystem: how-to/mock-fs.md
          - Mock a built-in global: how-to/mock-builtin.md
          - Mock UCI configuration: how-to/mock-uci.md
          - Mock ubus calls: how-to/mock-ubus.md
          - Mock the event loop: how-to/mock-uloop.md
          - Mock HTTP requests: how-to/mock-uclient.md
          - Use strict mode: how-to/strict-mode.md
          - Write a custom proxy: how-to/custom-proxy.md
          - Inspect calls with spy(): how-to/spy.md
      - Assertions:
