site_name: utest
site_description: A modern, non-invasive testing framework for the ucode ecosystem.
site_url: https://ucode-lang.org/utest/
repo_url: https://github.com/ucode-lang/utest
repo_name: ucode-lang/utest
site_dir: bin/site

theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/logo.svg
  # Match ucode-lang.org: system font stacks, no web fonts.
  font: false
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - announce.dismiss
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

extra_css:
  - stylesheets/ucode.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/ucode-lang/utest
      name: utest on GitHub
    - icon: material/web
      link: https://ucode-lang.org/
      name: ucode-lang.org

copyright: utest is released under the MIT license and is part of the <a href="https://ucode-lang.org/">ucode</a> project.

markdown_extensions:
  - attr_list
  - md_in_html
  - admonition
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

nav:
